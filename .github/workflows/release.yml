name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package source
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "BlueBye-$env:GITHUB_REF_NAME-source.zip"
          $items = Get-ChildItem -Force | Where-Object { $_.Name -ne '.git' }
          Compress-Archive -Path $items -DestinationPath $zip -Force
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $zip dist/

      - name: Build setup exe
        shell: pwsh
        run: ./installer/build.ps1

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release create $tag `
            "dist/BlueBye-Setup.exe" `
            "dist/BlueBye-$tag-source.zip" `
            --title "BlueBye $tag" `
            --generate-notes
